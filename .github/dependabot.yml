version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Etc/UTC
    groups:
      javascript-production:
        dependency-type: production
        patterns: ["*"]
      javascript-development:
        dependency-type: development
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Etc/UTC
    groups:
      python-production:
        dependency-type: production
        patterns: ["*"]
      python-development:
        dependency-type: development
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Etc/UTC
    groups:
      terraform:
        patterns: ["*"]
    open-pull-requests-limit: 5