version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Etc/UTC
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "05:15"
      timezone: Etc/UTC
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    open-pull-requests-limit: 2

  - package-ecosystem: pip
    directories:
      - /
      - /services/api
      - /services/mcp
      - /workers/ingestion
      - /packages/python/aegon_common
    schedule:
      interval: monthly
      time: "05:30"
      timezone: Etc/UTC
    groups:
      python-workspace:
        patterns: ["*"]
        group-by: dependency-name
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    open-pull-requests-limit: 2

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: monthly
      time: "05:45"
      timezone: Etc/UTC
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    open-pull-requests-limit: 2