name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.8.22"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python dependencies
        run: uv sync --frozen --all-packages --dev
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run pyright
      - name: Test with coverage
        run: |
          uv run --with pytest-cov==7.0.0 pytest \
            --cov=infra.migrations.migrate \
            --cov=services/api/src \
            --cov=services/mcp/src \
            --cov=workers/ingestion/src \
            --cov=packages/python/aegon_common/src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml
      - name: Enforce changed-code coverage
        env:
          DIFF_BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}
        run: uv run --with diff-cover==9.7.1 diff-cover coverage.xml --compare-branch="$DIFF_BASE" --fail-under=90
      - name: Evaluate retrieval regression
        run: make evaluate-retrieval

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm exec tsc --build

  ci-gate:
    name: CI Gate
    if: always()
    needs: [python, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful CI jobs
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          test "$PYTHON_RESULT" = "success"
          test "$WEB_RESULT" = "success"