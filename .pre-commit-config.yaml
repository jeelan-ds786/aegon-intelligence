repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: eslint
        language: node
        additional_dependencies:
          - "@eslint/js@9.37.0"
          - "eslint@9.37.0"
          - "typescript@5.9.3"
          - "typescript-eslint@8.46.1"
        files: '\.(ts|tsx)$'
        require_serial: true
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks