[project]
name = "aegon-rag"
version = "0.0.0"
description = "A multi-tenant, multimodal RAG platform."
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis==6.168.3",
    "pre-commit==4.6.2",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "services/api",
    "services/mcp",
    "workers/ingestion",
    "packages/python/aegon_common",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-config --strict-markers"
testpaths = [
    "services/api/tests",
    "services/mcp/tests",
    "workers/ingestion/tests",
    "packages/python/aegon_common/tests",
]