[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "aegon-api"
version = "0.0.0"
description = "Aegon-RAG API service package."
requires-python = "==3.12.*"
dependencies = [
	"aegon-common",
	"cryptography==50.0.2",
	"fastapi==0.119.0",
	"psycopg-pool==3.2.7",
	"pydantic-settings==2.11.0",
	"rfc8785==0.1.4",
	"uvicorn==0.37.0",
]

[project.scripts]
aegon-api = "aegon_api.main:run"

[tool.uv.sources]
aegon-common = { workspace = true }
